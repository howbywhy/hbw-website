<style id="archive-world-styles">
  /*
    Fill parent when it has height; never collapse to 0 (flex + height:100% alone often yields 0px).
    max(100%,100dvh) keeps the block at least one viewport tall when the parent has no usable height.
  */
  .archive-gallery.archive-world {
    position: relative;
    z-index: 100;
    isolation: isolate;
    width: 100%;
    height: 100%;
    /* svh = stable viewport — less jump when mobile browser chrome shows/hides */
    min-height: 100vh;
    min-height: max(100%, 100vh);
    min-height: 100svh;
    min-height: max(100%, 100svh);
    flex: 1 1 auto;
    flex-shrink: 0;
    align-self: stretch;
    box-sizing: border-box;
    overflow: hidden;
    overscroll-behavior: none;
    background: transparent;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }

  .archive-gallery.archive-world.is-dragging {
    cursor: grabbing;
  }

  .archive-gallery__viewport {
    position: absolute;
    inset: 0;
    min-height: 100%;
    /* Inset keeps 3D content away from edges; bottom padding reduces “cut off” on mobile / safe areas */
    padding: max(0px, env(safe-area-inset-top, 0px)) max(0px, env(safe-area-inset-right, 0px))
      max(12px, env(safe-area-inset-bottom, 0px)) max(0px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
    perspective: 1600px;
    /* Slightly above center compensates for rotateX() — avoids the cluster feeling “half below” the fold */
    perspective-origin: 50% 42%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .archive-gallery__world {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
    pointer-events: none;
  }

  .archive-gallery__world > .archive-gallery-item {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: auto;
    -webkit-user-drag: none;
    /* Sized by JS to match media aspect ratio (prevents big empty rectangles). */
    width: auto;
    height: auto;
    max-width: min(320px, 42vw);
    max-height: min(420px, 52vh);
    background: transparent !important;
    opacity: 1 !important;
    box-shadow: none;
    border-radius: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    cursor: pointer;
  }

  .archive-gallery__world > .archive-gallery-item > img,
  .archive-gallery__world > .archive-gallery-item img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    user-select: none;
    background: transparent !important;
  }

  .archive-gallery__world > .archive-gallery-item > video,
  .archive-gallery__world > .archive-gallery-item video {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    user-select: none;
    background: transparent !important;
  }

  /* Signature anchor: 30% bigger in the 3D world only */
  .archive-gallery__world .signature {
    transform: scale(1.3);
    transform-origin: center center;
  }

  /* Webflow Code Embed blocks often render via an iframe. */
  .archive-gallery__world > .archive-gallery-item iframe,
  .archive-gallery__world > .archive-gallery-item embed,
  .archive-gallery__world > .archive-gallery-item object {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border: 0;
    background: transparent;
  }

  /* Webflow embed wrappers sometimes apply a background */
  .archive-gallery__world > .archive-gallery-item .w-embed,

    background: transparent !important;
  }

  /* Webflow image wrappers can apply translucent backgrounds/overlays */
